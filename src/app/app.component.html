@if (!auth.isReady()) {
  <div class="app-boot">
    <div class="spinner spinner-lg"></div>
  </div>
} @else {
  @if (auth.isAuthenticated()) {
    <header class="app-header">
      <a routerLink="/" class="app-brand">
        <span class="app-brand-icon" aria-hidden="true">
          <img src="favicon.svg" alt="" width="20" height="20" />
        </span>
        CarKeeper
      </a>

      <div class="grow"></div>

      <a routerLink="/help" class="btn-icon" title="Обучение">❓</a>

      <button type="button" class="btn-icon" (click)="theme.cycle()"
              [title]="theme.title()">
        {{ theme.icon() }}
      </button>

      <a routerLink="/profile" class="app-user faint" title="Профиль">{{ auth.user()?.email }}</a>

      <button type="button" ckButton="ghost" ckSmall (click)="logout()">Выйти</button>
    </header>
  }

  <main class="app-main">
    <router-outlet />
  </main>
}

<ck-toasts />
