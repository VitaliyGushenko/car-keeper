@if (!auth.isReady()) {
  <div class="app-boot">
    <div class="spinner spinner-lg"></div>
  </div>
} @else {
  @if (auth.isAuthenticated()) {
    <header class="app-header">
      <a routerLink="/" class="app-brand">
        <span class="app-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="2.6" />
            <path d="M12 14.6V21" />
            <path d="M9.5 10.8 3.5 8.6" />
            <path d="M14.5 10.8 20.5 8.6" />
          </svg>
        </span>
        CarKeeper
      </a>

      <div class="grow"></div>

      <button type="button" class="btn-icon" (click)="theme.cycle()"
              [title]="theme.title()">
        {{ theme.icon() }}
      </button>

      <a routerLink="/profile" class="app-user faint" title="Профиль">{{ auth.user()?.email }}</a>

      <button type="button" ckButton="ghost" ckSmall (click)="logout()">Выйти</button>
    </header>
  }

  <main class="app-main">
    <router-outlet />
  </main>
}

<ck-toasts />
