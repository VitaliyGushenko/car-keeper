<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>CarKeeper</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Единственный кандидат: Chrome при двух link может предпочесть старый .ico из кэша. ?v= сбрасывает кэш при обновлении иконки. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <script>
    // Тема применяется до загрузки приложения, чтобы не было «вспышки».
    try {
      var t = localStorage.getItem('ck-theme') || 'system';
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset['theme'] = dark ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset['theme'] = 'dark';
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
