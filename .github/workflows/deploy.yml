name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: esbuild 0.25 (vite) vs 0.28 (@angular/build) ломает
        # postinstall-проверку версии на чистой установке; бинарники esbuild
        # ставятся platform-пакетами и без скриптов.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Deploy Hosting + Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore:rules --project car-keeper-a97bb --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
